linters:
  enable:
    - gosimple
    - staticcheck
    - unused
    - errcheck
    - govet
    - ineffassign
    - gofmt
    - goimports
    - misspell
    - godox
  disable:
    - typecheck

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close
      - os.Remove
      - os.MkdirAll
      - os.Setenv
  godox:
    keywords:
      - BUG
      - FIXME
      - TODO

issues:
  exclude-use-default: false
  exclude-rules:
    - path: _test\.go
      linters:
        - unused
    - path: internal/container/events\.go
      linters:
        - unused
    - path: internal/image/push\.go
      linters:
        - unused
    - path: internal/image/pull\.go
      linters:
        - unused
